<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEM Measure & Area</title>
<style>
html,body{height:100%;margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1220;color:#e6edf7}
#wrap{display:flex;flex-direction:column;height:100%}
#topbar{padding:8px 12px;background:#152238;border-bottom:1px solid #2b3b58;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#topbar a{color:#38bdf8;text-decoration:none;padding:4px 8px;border:1px solid #2b3b58;border-radius:5px;font-size:12px}
#topbar h1{font-size:14px;margin:0;font-weight:600}
#fileInfo{font-size:11px;color:#8fa3c0;margin-left:auto}
#controls{padding:8px 12px;background:#1c2942;border-bottom:1px solid #2b3b58;display:flex;gap:6px;flex-wrap:wrap}
#controls button{padding:7px 11px;border:1px solid #2b3b58;border-radius:6px;background:#22304a;color:#e6edf7;cursor:pointer;font-size:12px;font-weight:550}
#controls button:hover{background:#2c3d5c}
#controls button.active{background:#0ea5e9;color:#001;border-color:#0ea5e9}
#controls button.primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);border-color:#0ea5e9;color:#001}
#main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;background:#070d18}
#canvas{max-width:100%;max-height:100%;border:1px solid #2b3b58;border-radius:6px;background:#070d18;touch-action:none;cursor:crosshair}
#panel{flex:0 0 260px;background:#152238;border-left:1px solid #2b3b58;padding:12px;overflow-y:auto;font-size:12.5px}
#panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8fa3c0;margin:0 0 8px;font-weight:700}
#panel .sect{margin-bottom:14px}
#panel .row{display:flex;justify-content:space-between;padding:3px 0;gap:8px}
#panel .row span:first-child{color:#8fa3c0}
#panel .row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
#status{padding:8px 12px;background:#152238;border-top:1px solid #2b3b58;font-size:12px;min-height:18px}
#fileInput{display:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.tile{background:#0f1a2e;border:1px solid #2b3b58;border-radius:8px;padding:9px 11px;min-width:0}
.tile .v{font-size:16px;font-weight:700;color:#22d3ee;line-height:1.15;word-break:break-word}
.tile .l{font-size:10px;color:#8fa3c0;margin-top:3px;text-transform:uppercase;letter-spacing:.6px}
.tile.main{grid-column:1/-1;background:linear-gradient(135deg,#0f2942,#0d1f36);border-color:#1d4f6b}
.tile.main .v{font-size:26px;color:#67e8f9}
@media (max-width:700px){
  #main{flex-direction:column}
  #panel{flex:0 0 auto;border-left:none;border-top:1px solid #2b3b58;max-height:50%}
}
</style>
</head>
<body>
<div id="wrap">
<div id="topbar">
<a href="./">← ASC Viewer</a>
<h1>📏 DEM Measure &amp; Area</h1>
<span id="fileInfo">No file loaded</span>
</div>
<div id="controls">
<button id="loadBtn" class="primary">📂 Load .asc</button>
<input type="file" id="fileInput" accept=".asc,.txt,.grd,.dem">
<button id="lockBtn">🔓 Unlock</button>
<button id="areaBtn">⬛ Area mode</button>
<button id="distBtn">📏 Distance mode</button>
<button id="clearBtn">🗑️ Clear</button>
</div>
<div id="main">
<div id="stage"><canvas id="canvas"></canvas></div>
<aside id="panel">
<div class="sect">
<h2>Status</h2>
<div class="row"><span>Mode</span><span id="pMode">Distance</span></div>
<div class="row"><span>Points</span><span id="pCount">0 / 2</span></div>
</div>
<div class="sect">
<h2 id="pResTitle">Distance</h2>
<div id="pRows"></div>
</div>
</aside>
</div>
<div id="status">Load a .asc file to begin.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$('canvas'), ctx=canvas.getContext('2d');
const S={grid:null,nrows:0,ncols:0,cellX:1,cellY:1,minZ:0,maxZ:1,locked:true,mode:'distance',points:[],step:1,dRows:0,dCols:0,dGrid:null};
const HEADER_KEYS=new Set(['ncols','nrows','xllcorner','yllcorner','xllcenter','yllcenter','cellsize','dx','dy','nodata_value','nodata']);

function parseASC(text){
const lines=text.split(/\r?\n/);const header={};let dataStart=0;
for(let i=0;i<lines.length;i++){const t=lines[i].trim();if(!t)continue;const p=t.split(/\s+/);const k=p[0].toLowerCase();const v=parseFloat(p[1]);if(HEADER_KEYS.has(k)&&p.length>=2&&isFinite(v)){header[k]=v;dataStart=i+1}else break}
const ncols=header.ncols|0,nrows=header.nrows|0;if(!ncols||!nrows)throw new Error('Missing ncols/nrows');
const cellX=header.cellsize??header.dx??1, cellY=header.cellsize??header.dy??1;
let xll=header.xllcorner??header.xllcenter??0, yll=header.yllcorner??header.yllcenter??0;
if(header.xllcorner===undefined&&header.xllcenter!==undefined)xll-=cellX/2;
if(header.yllcorner===undefined&&header.yllcenter!==undefined)yll-=cellY/2;
const nodata=header.nodata_value??header.nodata??-9999;
const toks=lines.slice(dataStart).join(' ').split(/[\s,]+/);
const grid=new Float32Array(nrows*ncols);let k=0;
for(let i=0;i<toks.length&&k<grid.length;i++){const s=toks[i];if(!s)continue;const v=parseFloat(s);grid[k++]=(isNaN(v)||Math.abs(v-nodata)<1e-3)?NaN:v}
while(k<grid.length)grid[k++]=NaN;
return{grid,nrows,ncols,cellX,cellY};
}

function cmap(t){
const s=[[0,36,70,128],[0.25,70,160,92],[0.5,222,212,142],[0.75,152,112,86],[1,250,250,252]];
t=Math.max(0,Math.min(1,t));let a=s[0],b=s[s.length-1];
for(let i=0;i<s.length-1;i++)if(t>=s[i][0]&&t<=s[i+1][0]){a=s[i];b=s[i+1];break}
const f=(t-a[0])/((b[0]-a[0])||1);
return[Math.round(a[1]+f*(b[1]-a[1])),Math.round(a[2]+f*(b[2]-a[2])),Math.round(a[3]+f*(b[3]-a[3]))];
}

function buildDisplay(){
if(!S.grid)return;
const maxSide=1400;
const step=Math.max(1,Math.ceil(Math.max(S.nrows,S.ncols)/maxSide));
S.step=step;S.dRows=Math.ceil(S.nrows/step);S.dCols=Math.ceil(S.ncols/step);
const dG=new Float32Array(S.dRows*S.dCols);
for(let y=0;y<S.dRows;y++)for(let x=0;x<S.dCols;x++){
const y0=y*step,y1=Math.min(y0+step,S.nrows),x0=x*step,x1=Math.min(x0+step,S.ncols);
let sum=0,n=0;
for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++){const v=S.grid[j*S.ncols+i];if(!isNaN(v)){sum+=v;n++}}
dG[y*S.dCols+x]=n?sum/n:NaN;
}
S.dGrid=dG;
canvas.width=S.dCols;canvas.height=S.dRows;
const stage=$('stage');
const aw=stage.clientWidth-20, ah=stage.clientHeight-20;
const ar=S.dCols/S.dRows;
let w=aw,h=aw/ar;if(h>ah){h=ah;w=ah*ar}
canvas.style.width=Math.floor(w)+'px';
canvas.style.height=Math.floor(h)+'px';
draw();
}

function draw(){
if(!S.dGrid)return;
const img=ctx.createImageData(S.dCols,S.dRows);const d=img.data;
const range=(S.maxZ-S.minZ)||1;
for(let i=0;i<S.dRows*S.dCols;i++){
const v=S.dGrid[i];let r=12,g=14,b=20;
if(!isNaN(v)){const c=cmap((v-S.minZ)/range);r=c[0];g=c[1];b=c[2]}
const o=i*4;d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255;
}
ctx.putImageData(img,0,0);
if(!S.points.length)return;
ctx.lineWidth=Math.max(2,S.dCols/500);
ctx.strokeStyle='#38bdf8';
if(S.mode==='distance'&&S.points.length===2){
ctx.beginPath();ctx.moveTo(S.points[0].x,S.points[0].y);ctx.lineTo(S.points[1].x,S.points[1].y);ctx.stroke();
}else if(S.mode==='area'&&S.points.length>=3){
ctx.beginPath();ctx.moveTo(S.points[0].x,S.points[0].y);
for(let i=1;i<S.points.length;i++)ctx.lineTo(S.points[i].x,S.points[i].y);
ctx.closePath();ctx.fillStyle='rgba(34,211,238,0.25)';ctx.fill();ctx.stroke();
}else if(S.points.length>1){
ctx.beginPath();ctx.moveTo(S.points[0].x,S.points[0].y);
for(let i=1;i<S.points.length;i++)ctx.lineTo(S.points[i].x,S.points[i].y);
ctx.stroke();
}
for(const p of S.points){
ctx.beginPath();ctx.arc(p.x,p.y,Math.max(4,S.dCols/200),0,Math.PI*2);
ctx.fillStyle='#f43f5e';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
}
}

function updateResults(){
$('pMode').textContent=S.mode==='area'?'Area':'Distance';
const max=S.mode==='area'?6:2;
$('pCount').textContent=`${S.points.length} / ${max}`;
const res=$('pRes'), rows=$('pRows');
if(!S.grid){$('pResTitle').textContent='Result';rows.innerHTML='<div class="tiles"><div class="tile main"><div class="v">—</div><div class="l">Load an .asc file</div></div></div>';return}
const sx=S.cellX*S.step, sy=S.cellY*S.step;

if(S.mode==='distance'){
$('pResTitle').textContent='Distance';
if(S.points.length===2){
const dx=(S.points[1].x-S.points[0].x)*sx;
const dy=(S.points[1].y-S.points[0].y)*sy;
const d=Math.hypot(dx,dy);
rows.innerHTML=
`<div class="tiles">
<div class="tile main"><div class="v">${d.toFixed(2)} m</div><div class="l">Meters</div></div>
<div class="tile"><div class="v">${(d/1000).toFixed(4)}</div><div class="l">Kilometers</div></div>
<div class="tile"><div class="v">${(d*3.280839895).toFixed(1)}</div><div class="l">Feet</div></div>
<div class="tile"><div class="v">${(d*0.000621371192).toFixed(4)}</div><div class="l">Miles</div></div>
<div class="tile"><div class="v">${dx.toFixed(1)}</div><div class="l">ΔX (m)</div></div>
<div class="tile"><div class="v">${dy.toFixed(1)}</div><div class="l">ΔY (m)</div></div>
</div>`;
}else{
rows.innerHTML=`<div class="tiles"><div class="tile main"><div class="v">Tap point ${S.points.length+1} of 2</div><div class="l">Click on the terrain</div></div></div>`;
}
return;
}

$('pResTitle').textContent='Area';
if(S.points.length>=3){
let a2=0;
for(let i=0;i<S.points.length;i++){
const a=S.points[i], b=S.points[(i+1)%S.points.length];
a2+=(a.x*sx)*(b.y*sy)-(b.x*sx)*(a.y*sy);
}
const m2=Math.abs(a2)/2;
rows.innerHTML=
`<div class="tiles">
<div class="tile main"><div class="v">${m2.toFixed(2)} m²</div><div class="l">Square meters</div></div>
<div class="tile"><div class="v">${(m2*0.0001).toFixed(4)}</div><div class="l">Hectares</div></div>
<div class="tile"><div class="v">${(m2*0.000247105381).toFixed(4)}</div><div class="l">Acres</div></div>
<div class="tile"><div class="v">${(m2/1e6).toFixed(6)}</div><div class="l">Square km</div></div>
<div class="tile"><div class="v">${(m2*10.7639104).toFixed(0)}</div><div class="l">Square ft</div></div>
<div class="tile"><div class="v">${(m2*3.86102159e-7).toExponential(2)}</div><div class="l">Square mi</div></div>
<div class="tile"><div class="v">${S.points.length}</div><div class="l">Vertices</div></div>
</div>`;
}else{
rows.innerHTML=`<div class="tiles"><div class="tile main"><div class="v">Tap point ${S.points.length+1} of 6</div><div class="l">Minimum 3 to compute</div></div></div>`;
}
}

function clearAll(){S.points=[];draw();updateResults();$('status').textContent='Cleared.'}
function setMode(m){
S.mode=m;
$('areaBtn').classList.toggle('active',m==='area');
$('distBtn').classList.toggle('active',m==='distance');
S.points=[];draw();updateResults();
$('status').textContent=m==='area'?'Area mode: tap 3–6 points.':'Distance mode: tap 2 points.';
}
function setLocked(v){
S.locked=v;
$('lockBtn').textContent=v?'🔓 Unlock':'🔒 Lock';
$('lockBtn').classList.toggle('active',v);
}

let _lastTap=0;
canvas.addEventListener('pointerdown',e=>{
if(!S.grid){$('status').textContent='Load an .asc file first.';return}
if(S.locked){$('status').textContent='Locked. Tap Unlock to add points.';return}
const now=Date.now();
if(now-_lastTap<120)return;
_lastTap=now;
e.preventDefault();
const rect=canvas.getBoundingClientRect();
const x=(e.clientX-rect.left)*(canvas.width/rect.width);
const y=(e.clientY-rect.top)*(canvas.height/rect.height);
const max=S.mode==='area'?6:2;
if(S.points.length>=max)S.points=[];
S.points.push({x,y});
draw();updateResults();
});

$('loadBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{
const f=e.target.files[0];if(!f)return;
$('status').textContent='⏳ Parsing file…';
try{
const text=await f.text();
const parsed=parseASC(text);
S.grid=parsed.grid;S.nrows=parsed.nrows;S.ncols=parsed.ncols;S.cellX=parsed.cellX;S.cellY=parsed.cellY;
let mn=Infinity,mx=-Infinity;
for(let i=0;i<parsed.grid.length;i++){const v=parsed.grid[i];if(isNaN(v))continue;if(v<mn)mn=v;if(v>mx)mx=v}
S.minZ=mn;S.maxZ=mx;S.points=[];
$('fileInfo').textContent=`${f.name} · ${parsed.ncols}×${parsed.nrows} · cell ${parsed.cellX}×${parsed.cellY} m`;
buildDisplay();updateResults();
$('status').textContent=`Loaded. ${S.locked?'Tap Unlock to start.':'Tap the map to add points.'}`;
}catch(err){console.error(err);$('status').textContent='Error: '+err.message}
};
$('lockBtn').onclick=()=>{setLocked(!S.locked);$('status').textContent=S.locked?'Locked.':'Unlocked — tap the map.'};
$('areaBtn').onclick=()=>setMode('area');
$('distBtn').onclick=()=>setMode('distance');
$('clearBtn').onclick=clearAll;

setMode('distance');
setLocked(true);
</script>
</body>
</html>
