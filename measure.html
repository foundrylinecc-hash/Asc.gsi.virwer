<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEM Measure & Area</title>
<style>
html,body{height:100%;margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1220;color:#e6edf7}
#wrap{display:flex;flex-direction:column;height:100%}
#topbar{padding:8px 12px;background:#152238;border-bottom:1px solid #2b3b58;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#topbar a{color:#38bdf8;text-decoration:none;padding:4px 8px;border:1px solid #2b3b58;border-radius:5px;font-size:12px}
#topbar h1{font-size:14px;margin:0;font-weight:600}
#fileInfo{font-size:11px;color:#8fa3c0;margin-left:auto}
#controls{padding:8px 12px;background:#1c2942;border-bottom:1px solid #2b3b58;display:flex;gap:6px;flex-wrap:wrap}
#controls button{padding:6px 10px;border:1px solid #2b3b58;border-radius:5px;background:#22304a;color:#e6edf7;cursor:pointer;font-size:12px}
#controls button:hover{background:#2c3d5c}
#controls button.active{background:#0ea5e9;color:#001;border-color:#0ea5e9}
#controls button.primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);border-color:#0ea5e9;color:#001}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;background:#070d18}
#canvas{max-width:100%;max-height:100%;border:1px solid #2b3b58;border-radius:6px;background:#070d18;touch-action:none;cursor:crosshair}
#result{padding:10px 12px;background:#152238;border-top:1px solid #2b3b58;font-size:13px;min-height:22px;line-height:1.5}
#result b{color:#22d3ee}
#fileInput{display:none}
</style>
</head>
<body>
<div id="wrap">
<div id="topbar">
<a href="./">← ASC Viewer</a>
<h1>📏 DEM Measure &amp; Area</h1>
<span id="fileInfo">No file loaded</span>
</div>
<div id="controls">
<button id="loadBtn" class="primary">📂 Load .asc</button>
<input type="file" id="fileInput" accept=".asc,.txt,.grd,.dem">
<button id="lockBtn">🔒 Lock</button>
<button id="areaBtn">Area mode</button>
<button id="distBtn">Distance mode</button>
<button id="clearBtn">Clear</button>
</div>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="result">Load a .asc file to begin measuring.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const S = { grid:null, nrows:0, ncols:0, cellX:1, cellY:1, minZ:0, maxZ:1, locked:true, mode:'area', points:[], step:1, dRows:0, dCols:0, dGrid:null };
const HEADER_KEYS = new Set(['ncols','nrows','xllcorner','yllcorner','xllcenter','yllcenter','cellsize','dx','dy','nodata_value','nodata']);

function parseASC(text){
  const lines = text.split(/\r?\n/); const header = {}; let dataStart = 0;
  for (let i=0;i<lines.length;i++){
    const t = lines[i].trim(); if (!t) continue;
    const p = t.split(/\s+/); const k = p[0].toLowerCase(); const v = parseFloat(p[1]);
    if (HEADER_KEYS.has(k) && p.length>=2 && isFinite(v)) { header[k]=v; dataStart=i+1; } else break;
  }
  const ncols = header.ncols|0, nrows = header.nrows|0;
  if (!ncols || !nrows) throw new Error('Missing ncols/nrows');
  const cellX = header.cellsize ?? header.dx ?? 1;
  const cellY = header.cellsize ?? header.dy ?? 1;
  let xll = header.xllcorner ?? header.xllcenter ?? 0;
  let yll = header.yllcorner ?? header.yllcenter ?? 0;
  if (header.xllcorner===undefined && header.xllcenter!==undefined) xll -= cellX/2;
  if (header.yllcorner===undefined && header.yllcenter!==undefined) yll -= cellY/2;
  const nodata = header.nodata_value ?? header.nodata ?? -9999;
  const toks = lines.slice(dataStart).join(' ').split(/[\s,]+/);
  const grid = new Float32Array(nrows*ncols); let k=0;
  for (let i=0;i<toks.length && k<grid.length;i++){
    const s = toks[i]; if (!s) continue;
    const v = parseFloat(s);
    grid[k++] = (isNaN(v) || Math.abs(v-nodata)<1e-3) ? NaN : v;
  }
  while (k<grid.length) grid[k++]=NaN;
  return { grid, nrows, ncols, cellX, cellY };
}

function cmap(t){
  const s=[[0,36,70,128],[0.25,70,160,92],[0.5,222,212,142],[0.75,152,112,86],[1,250,250,252]];
  t = Math.max(0, Math.min(1, t));
  let a=s[0], b=s[s.length-1];
  for (let i=0;i<s.length-1;i++) if (t>=s[i][0] && t<=s[i+1][0]) { a=s[i]; b=s[i+1]; break; }
  const f = (t-a[0]) / ((b[0]-a[0])||1);
  return [Math.round(a[1]+f*(b[1]-a[1])), Math.round(a[2]+f*(b[2]-a[2])), Math.round(a[3]+f*(b[3]-a[3]))];
}

function buildDisplay(){
  if (!S.grid) return;
  const maxSide = 1400;
  const step = Math.max(1, Math.ceil(Math.max(S.nrows, S.ncols) / maxSide));
  S.step = step;
  S.dRows = Math.ceil(S.nrows/step);
  S.dCols = Math.ceil(S.ncols/step);
  const dG = new Float32Array(S.dRows * S.dCols);
  for (let y=0;y<S.dRows;y++) for (let x=0;x<S.dCols;x++){
    const y0=y*step, y1=Math.min(y0+step,S.nrows);
    const x0=x*step, x1=Math.min(x0+step,S.ncols);
    let sum=0,n=0;
    for (let j=y0;j<y1;j++) for (let i=x0;i<x1;i++){ const v=S.grid[j*S.ncols+i]; if(!isNaN(v)){sum+=v;n++;} }
    dG[y*S.dCols+x] = n ? sum/n : NaN;
  }
  S.dGrid = dG;
  canvas.width = S.dCols; canvas.height = S.dRows;
  const stage = $('stage');
  const aw = stage.clientWidth-20, ah = stage.clientHeight-20;
  const ar = S.dCols / S.dRows;
  let w=aw, h=aw/ar; if (h>ah){h=ah;w=ah*ar;}
  canvas.style.width = Math.floor(w)+'px';
  canvas.style.height = Math.floor(h)+'px';
  draw();
}

function draw(){
  if (!S.dGrid) return;
  const img = ctx.createImageData(S.dCols, S.dRows);
  const d = img.data;
  const range = (S.maxZ - S.minZ) || 1;
  for (let i=0;i<S.dRows*S.dCols;i++){
    const v = S.dGrid[i];
    let r=12,g=14,b=20;
    if (!isNaN(v)){ const c=cmap((v-S.minZ)/range); r=c[0];g=c[1];b=c[2]; }
    const o=i*4; d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
  }
  ctx.putImageData(img, 0, 0);
  if (!S.points.length) return;
  ctx.lineWidth = Math.max(2, S.dCols/500);
  ctx.strokeStyle = '#38bdf8';
  if (S.mode==='distance' && S.points.length===2){
    ctx.beginPath(); ctx.moveTo(S.points[0].x, S.points[0].y); ctx.lineTo(S.points[1].x, S.points[1].y); ctx.stroke();
  } else if (S.mode==='area' && S.points.length>=3){
    ctx.beginPath(); ctx.moveTo(S.points[0].x, S.points[0].y);
    for (let i=1;i<S.points.length;i++) ctx.lineTo(S.points[i].x, S.points[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(34,211,238,0.25)'; ctx.fill(); ctx.stroke();
  } else if (S.points.length>1){
    ctx.beginPath(); ctx.moveTo(S.points[0].x, S.points[0].y);
    for (let i=1;i<S.points.length;i++) ctx.lineTo(S.points[i].x, S.points[i].y);
    ctx.stroke();
  }
  for (const p of S.points){
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(4, S.dCols/200), 0, Math.PI*2);
    ctx.fillStyle = '#f43f5e'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }
}

function updateResult(){
  const r = $('result');
  if (!S.grid){ r.textContent = 'Load a .asc file to begin.'; return; }
  const sx = S.cellX * S.step, sy = S.cellY * S.step;
  if (S.mode==='distance'){
    if (S.points.length===2){
      const dx = (S.points[1].x - S.points[0].x) * sx;
      const dy = (S.points[1].y - S.points[0].y) * sy;
      const d = Math.hypot(dx, dy);
      r.innerHTML = `Distance: <b>${d.toFixed(2)} m</b> &nbsp;(${(d/1000).toFixed(3)} km / ${(d*0.000621371).toFixed(3)} mi)<br>Δx ${dx.toFixed(1)} m, Δy ${dy.toFixed(1)} m`;
    } else r.textContent = `Distance mode: ${S.points.length}/2 points. Tap on the map.`;
  } else {
    if (S.points.length>=3){
      let a2 = 0;
      for (let i=0;i<S.points.length;i++){
        const a = S.points[i], b = S.points[(i+1)%S.points.length];
        a2 += (a.x*sx)*(b.y*sy) - (b.x*sx)*(a.y*sy);
      }
      const m2 = Math.abs(a2)/2;
      r.innerHTML = `Area: <b>${m2.toFixed(1)} m²</b> &nbsp;(${(m2/10000).toFixed(4)} ha / ${(m2/4046.8564224).toFixed(3)} ac / ${(m2/1e6).toFixed(6)} km²)<br>${S.points.length} vertices`;
    } else r.textContent = `Area mode: ${S.points.length}/6 points (need at least 3).`;
  }
}

function clearAll(){ S.points = []; draw(); updateResult(); }
function setMode(m){ S.mode = m; $('areaBtn').classList.toggle('active', m==='area'); $('distBtn').classList.toggle('active', m==='distance'); clearAll(); }
function setLocked(v){ S.locked = v; $('lockBtn').textContent = v ? '🔓 Unlock' : '🔒 Lock'; $('lockBtn').classList.toggle('active', v); }

let _lastTap = 0;
canvas.addEventListener('pointerdown', e => {
  if (!S.grid) return;
  if (S.locked){ $('result').textContent = 'Map is locked. Tap Unlock to add points.'; return; }
  const now = Date.now();
  if (now - _lastTap < 120) return;   // ignore duplicate from mobile double-fire
  _lastTap = now;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const max = S.mode === 'area' ? 6 : 2;
  if (S.points.length >= max) S.points = [];   // start a fresh measurement instead of blocking
  S.points.push({ x, y });
  draw(); updateResult();
});

$('loadBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('result').textContent = '⏳ Parsing file…';
  try {
    const text = await f.text();
    const parsed = parseASC(text);
    S.grid = parsed.grid; S.nrows = parsed.nrows; S.ncols = parsed.ncols;
    S.cellX = parsed.cellX; S.cellY = parsed.cellY;
    let mn = Infinity, mx = -Infinity;
    for (let i=0;i<parsed.grid.length;i++){ const v = parsed.grid[i]; if (isNaN(v)) continue; if (v<mn) mn=v; if (v>mx) mx=v; }
    S.minZ = mn; S.maxZ = mx; S.points = [];
    $('fileInfo').textContent = `${f.name} · ${parsed.ncols}×${parsed.nrows} · cell ${parsed.cellX}×${parsed.cellY}`;
    buildDisplay(); updateResult();
  } catch(err){ console.error(err); $('result').textContent = 'Error: ' + err.message; }
};
$('lockBtn').onclick = () => setLocked(!S.locked);
$('areaBtn').onclick = () => setMode('area');
$('distBtn').onclick = () => setMode('distance');
$('clearBtn').onclick = clearAll;

setMode('area');
setLocked(true);
</script>
</body>
</html>
