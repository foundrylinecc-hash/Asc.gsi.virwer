<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Measure & Area</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
html, body, #map { height: 100%; margin: 0; }
#controls { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 8px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4); display: flex; gap: 6px; flex-wrap: wrap; font-family: sans-serif; }
#controls button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: #f8f8f8; cursor: pointer; font-size: 13px; }
#controls button:hover { background: #eee; }
#controls button.active { background: #007bff; color: white; border-color: #007bff; }
#back { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4); font-family: sans-serif; font-size: 13px; text-decoration: none; color: #007bff; }
#back:hover { background: #f0f0f0; }
#result { position: absolute; bottom: 20px; left: 10px; z-index: 1000; background: white; padding: 8px 12px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4); font-family: sans-serif; max-width: 320px; }
</style>
</head>
<body>
<div id="map"></div>
<a id="back" href="./">← ASC Viewer</a>
<div id="controls">
<button id="lockBtn">🔒 Lock map</button>
<button id="areaBtn">Area mode</button>
<button id="distBtn">Distance mode</button>
<button id="clearBtn">Clear</button>
</div>
<div id="result">Click map to add points.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
const map = L.map('map').setView([40.7128, -74.0060], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
let locked = false;
let mode = 'area';
let points = [];
let markers = [];
let shape = null;
const lockBtn = document.getElementById('lockBtn');
const areaBtn = document.getElementById('areaBtn');
const distBtn = document.getElementById('distBtn');
const clearBtn = document.getElementById('clearBtn');
const result = document.getElementById('result');
function setLocked(value) {
  locked = value;
  const methods = [map.dragging, map.touchZoom, map.doubleClickZoom, map.scrollWheelZoom, map.boxZoom, map.keyboard];
  methods.forEach(m => value ? m.disable() : m.enable());
  lockBtn.textContent = value ? '🔓 Unlock map' : '🔒 Lock map';
  lockBtn.classList.toggle('active', value);
}
lockBtn.onclick = () => setLocked(!locked);
function setMode(newMode) {
  mode = newMode;
  areaBtn.classList.toggle('active', mode === 'area');
  distBtn.classList.toggle('active', mode === 'distance');
  clearAll();
  result.textContent = mode === 'area' ? 'Area mode: click up to 6 points to outline an area.' : 'Distance mode: click 2 points to measure.';
}
areaBtn.onclick = () => setMode('area');
distBtn.onclick = () => setMode('distance');
function clearAll() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  points = [];
  if (shape) { map.removeLayer(shape); shape = null; }
  result.textContent = 'Cleared. Click map to add points.';
}
clearBtn.onclick = clearAll;
map.on('click', (e) => {
  const max = mode === 'area' ? 6 : 2;
  if (points.length >= max) {
    result.textContent = `Maximum ${max} points for ${mode} mode. Clear or switch mode.`;
    return;
  }
  const latlng = e.latlng;
  points.push(latlng);
  const marker = L.marker(latlng).addTo(map);
  markers.push(marker);
  updateShape();
});
function updateShape() {
  if (shape) { map.removeLayer(shape); shape = null; }
  if (mode === 'distance') {
    if (points.length === 2) {
      shape = L.polyline(points, { color: 'blue' }).addTo(map);
      const from = turf.point([points[0].lng, points[0].lat]);
      const to = turf.point([points[1].lng, points[1].lat]);
      const km = turf.distance(from, to, { units: 'kilometers' });
      const miles = km * 0.621371;
      result.textContent = `Distance: ${km.toFixed(3)} km (${miles.toFixed(3)} mi)`;
    } else {
      result.textContent = `Distance mode: ${points.length}/2 points.`;
    }
    return;
  }
  if (points.length >= 3) {
    const latlngs = points.map(p => [p.lat, p.lng]);
    shape = L.polygon(latlngs, { color: 'green', fillOpacity: 0.2 }).addTo(map);
    const coords = points.map(p => [p.lng, p.lat]);
    coords.push(coords[0]);
    const polygon = turf.polygon([coords]);
    const sqMeters = turf.area(polygon);
    const sqKm = sqMeters / 1e6;
    const acres = sqMeters / 4046.8564224;
    result.textContent = `Area: ${sqKm.toFixed(4)} km² (${acres.toFixed(2)} acres) — ${points.length}/6 points`;
  } else {
    result.textContent = `Area mode: ${points.length}/6 points. Need at least 3.`;
  }
}
setMode('area');
setLocked(true);
</script>
</body>
</html>
